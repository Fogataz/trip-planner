<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Overview — Planning phase</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: Inter, system-ui, sans-serif; color: #1a1a1a; }
    a { color: #1d4ed8; } a:hover { color: #1e40af; }
    button { font: inherit; cursor: pointer; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; display: flex; flex-direction: column; overflow: hidden">

  <div style="height: 48px; flex: none; border-bottom: 1px solid #cfcfcf; display: flex; align-items: center; justify-content: space-between; padding: 0 14px">
    <button type="button" style="background: none; border: none; padding: 0; font-size: 13px; font-weight: 500; color: #1a1a1a; display: flex; align-items: center; gap: 4px">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18 9 12l6-6"/></svg>
      Trips
    </button>
    <span style="width: 24px; height: 24px; border-radius: 99px; background: #ececec; border: 1px solid #cfcfcf; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 600; color: #6b6b6b">A</span>
  </div>

  <div style="height: 110px; flex: none; background: #ececec; display: flex; align-items: flex-end; padding: 8px 12px">
    <span style="font-size: 8px; font-weight: 700; letter-spacing: 1px; color: #8a8a8a">COVER</span>
  </div>

  <div style="flex: none; padding: 10px 16px 11px; border-bottom: 1px solid #cfcfcf; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px">
    <div>
      <h1 style="margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -0.3px">Madrid Gathering</h1>
      <div style="font-size: 12px; color: #6b6b6b; margin-top: 3px">Barcelona → Madrid · 24–25 Nov</div>
    </div>
    <div style="display: flex; flex: none; margin-top: 4px">
      <span style="width: 22px; height: 22px; border-radius: 99px; background: #ececec; border: 1.5px solid #fff; display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: 600; color: #6b6b6b">A</span>
      <span style="width: 22px; height: 22px; border-radius: 99px; background: #e0e0e0; border: 1.5px solid #fff; margin-left: -7px; display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: 600; color: #6b6b6b">L</span>
      <span style="width: 22px; height: 22px; border-radius: 99px; background: #d4d4d4; border: 1.5px solid #fff; margin-left: -7px; display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: 600; color: #6b6b6b">M</span>
    </div>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 14px 16px">

    <!-- needs your vote -->
    <div style="border: 1.5px solid #1a1a1a; border-radius: 10px; padding: 13px">
      <div style="font-size: 9px; font-weight: 700; letter-spacing: 1px; color: #1a1a1a">NEEDS YOUR VOTE</div>
      <div style="font-size: 14px; font-weight: 600; margin-top: 6px">Where do we eat on day 2?</div>
      <div style="margin-top: 9px; display: flex; flex-direction: column; gap: 5px">
        <div style="height: 26px; border: 1px solid #cfcfcf; border-radius: 6px; position: relative; overflow: hidden">
          <div style="position: absolute; inset: 0 55% 0 0; background: #ececec"></div>
          <div style="position: relative; height: 100%; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; font-size: 11px"><span>Casa Botín</span><span style="color: #6b6b6b">45%</span></div>
        </div>
        <div style="height: 26px; border: 1px solid #cfcfcf; border-radius: 6px; position: relative; overflow: hidden">
          <div style="position: absolute; inset: 0 70% 0 0; background: #ececec"></div>
          <div style="position: relative; height: 100%; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; font-size: 11px"><span>Mercado de San Miguel</span><span style="color: #6b6b6b">30%</span></div>
        </div>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 10px">
        <span style="font-size: 11px; color: #6b6b6b">2 of 4 voted · closes in 2 days</span>
        <button type="button" style="background: #1a1a1a; color: #fff; border: none; border-radius: 7px; padding: 7px 14px; font-size: 12px; font-weight: 600">Vote</button>
      </div>
    </div>

    <!-- plan progress -->
    <button type="button" style="margin-top: 12px; width: 100%; text-align: left; background: #fff; border: 1px solid #cfcfcf; border-radius: 10px; padding: 12px; display: flex; align-items: center; justify-content: space-between">
      <span>
        <span style="display: block; font-size: 13px; font-weight: 600">Your plan</span>
        <span style="display: block; font-size: 11px; color: #6b6b6b; margin-top: 2px">4 stops · day 2 has nothing yet</span>
      </span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b6b6b" stroke-width="2" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
    </button>

    <!-- activity -->
    <div style="margin-top: 12px; border: 1px solid #cfcfcf; border-radius: 10px; padding: 12px">
      <div style="font-size: 9px; font-weight: 700; letter-spacing: 1px; color: #6b6b6b">SINCE YOU WERE AWAY</div>
      <div style="margin-top: 9px; display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: center; gap: 8px; font-size: 12px">
          <span style="width: 20px; height: 20px; flex: none; border-radius: 99px; background: #ececec; display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: 600; color: #6b6b6b">A</span>
          <span>Ana added <strong style="font-weight: 600">Prado Museum</strong></span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; font-size: 12px">
          <span style="width: 20px; height: 20px; flex: none; border-radius: 99px; background: #e0e0e0; display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: 600; color: #6b6b6b">L</span>
          <span>Luis set the stay to <strong style="font-weight: 600">Hotel Riu Plaza</strong></span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; font-size: 12px">
          <span style="width: 20px; height: 20px; flex: none; border-radius: 99px; background: #d4d4d4; display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: 600; color: #6b6b6b">M</span>
          <span>Marta joined the trip</span>
        </div>
      </div>
    </div>

    <!-- ideas -->
    <button type="button" style="margin-top: 12px; width: 100%; text-align: left; background: #fff; border: 1px solid #cfcfcf; border-radius: 10px; padding: 12px; display: flex; align-items: center; justify-content: space-between">
      <span style="font-size: 13px; font-weight: 500">12 ideas from the assistant</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b6b6b" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </button>

  </div>

  <div style="height: 66px; flex: none; border-top: 1px solid #cfcfcf; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <button type="button" style="background: none; border: none; border-top: 2px solid #1a1a1a; margin-top: -1px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #1a1a1a">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5"/></svg>
      <span style="font-size: 10px; font-weight: 600">Overview</span>
    </button>
    <button type="button" style="background: none; border: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #6b6b6b">
      <span style="position: relative; display: flex">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span style="position: absolute; top: -5px; right: -7px; min-width: 15px; height: 15px; border-radius: 99px; background: #1a1a1a; color: #fff; font-size: 9px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 3px">1</span>
      </span>
      <span style="font-size: 10px; font-weight: 500">Plan</span>
    </button>
    <button type="button" style="background: none; border: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #6b6b6b">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 7h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 7V6a2 2 0 0 1 2-2h11"/><circle cx="17" cy="13" r="1.3"/></svg>
      <span style="font-size: 10px; font-weight: 500">Money</span>
    </button>
    <button type="button" style="background: none; border: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #6b6b6b">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 5.5a3.2 3.2 0 0 1 0 5"/><path d="M18 14.2c1.8.9 3 2.7 3 4.8"/></svg>
      <span style="font-size: 10px; font-weight: 500">Group</span>
    </button>
  </div>

</div>
</x-dc>
