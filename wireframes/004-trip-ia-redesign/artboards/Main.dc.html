<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trips list</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: Inter, system-ui, sans-serif; color: #1a1a1a; }
    a { color: #1d4ed8; } a:hover { color: #1e40af; }
    button { font: inherit; cursor: pointer; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; display: flex; flex-direction: column; overflow: hidden">

  <!-- app header -->
  <div style="height: 56px; flex: none; border-bottom: 1px solid #cfcfcf; display: flex; align-items: center; justify-content: space-between; padding: 0 16px">
    <span style="font-size: 15px; font-weight: 700; letter-spacing: -0.2px">Trip Planner</span>
    <div style="display: flex; align-items: center; gap: 12px">
      <button type="button" aria-label="Activity, 2 new" style="position: relative; background: none; border: none; padding: 0; color: #1a1a1a; display: flex">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>
        <span style="position: absolute; top: -3px; right: -4px; min-width: 14px; height: 14px; border-radius: 99px; background: #1a1a1a; color: #fff; font-size: 9px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 3px">2</span>
      </button>
      <span style="width: 26px; height: 26px; border-radius: 99px; background: #ececec; border: 1px solid #cfcfcf; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; color: #6b6b6b">A</span>
    </div>
  </div>

  <!-- body -->
  <div style="flex: 1; overflow: hidden; padding: 16px">

    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px">
      <h1 style="margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.4px">Your trips</h1>
      <button type="button" style="background: #1a1a1a; color: #fff; border: none; border-radius: 8px; padding: 8px 12px; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 5px">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        New trip
      </button>
    </div>

    <!-- LIVE NOW -->
    <div style="font-size: 10px; font-weight: 700; letter-spacing: 0.9px; color: #6b6b6b; margin-bottom: 8px">LIVE NOW</div>
    <div style="border: 1px solid #1a1a1a; border-radius: 10px; overflow: hidden; margin-bottom: 20px">
      <div style="height: 64px; background: #ececec; display: flex; align-items: flex-end; padding: 8px 10px">
        <span style="font-size: 8px; font-weight: 700; letter-spacing: 1px; color: #8a8a8a">COVER</span>
      </div>
      <div style="padding: 10px 12px 12px">
        <div style="font-size: 15px; font-weight: 600">Madrid Gathering</div>
        <div style="font-size: 12px; color: #6b6b6b; margin-top: 2px">Barcelona → Madrid · 4 going</div>
        <div style="display: flex; align-items: center; gap: 6px; margin-top: 8px">
          <span style="font-size: 10px; font-weight: 600; background: #1a1a1a; color: #fff; border-radius: 99px; padding: 3px 7px">DAY 2 OF 2</span>
          <span style="font-size: 11px; color: #1a1a1a">Next: Mercado de San Miguel · 13:00</span>
        </div>
      </div>
    </div>

    <!-- UPCOMING -->
    <div style="font-size: 10px; font-weight: 700; letter-spacing: 0.9px; color: #6b6b6b; margin-bottom: 8px">UPCOMING</div>
    <div style="border: 1px solid #cfcfcf; border-radius: 10px; overflow: hidden; margin-bottom: 20px">
      <div style="height: 64px; background: #f1f1f1; display: flex; align-items: flex-end; padding: 8px 10px">
        <span style="font-size: 8px; font-weight: 700; letter-spacing: 1px; color: #8a8a8a">COVER</span>
      </div>
      <div style="padding: 10px 12px 12px">
        <div style="font-size: 15px; font-weight: 600">Lisbon in March</div>
        <div style="font-size: 12px; color: #6b6b6b; margin-top: 2px">Barcelona → Lisbon · 6 going</div>
        <div style="font-size: 11px; color: #6b6b6b; margin-top: 8px">In 112 days · 8 stops planned</div>
      </div>
    </div>

    <!-- PAST -->
    <div style="font-size: 10px; font-weight: 700; letter-spacing: 0.9px; color: #6b6b6b; margin-bottom: 8px">PAST</div>
    <div style="border: 1px solid #cfcfcf; border-radius: 10px; overflow: hidden; background: #fafafa">
      <div style="padding: 10px 12px 12px">
        <div style="font-size: 15px; font-weight: 600; color: #6b6b6b">Porto weekend</div>
        <div style="font-size: 12px; color: #8a8a8a; margin-top: 2px">12–14 Sep · 5 going</div>
        <button type="button" style="margin-top: 9px; width: 100%; background: #fff; border: 1px solid #1a1a1a; border-radius: 8px; padding: 8px; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px">
          You owe €42 · Settle up
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
        </button>
      </div>
    </div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
