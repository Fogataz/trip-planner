<!doctype html>

<x-dc>
<helmet>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; display: flex; flex-direction: column; overflow: hidden">

  <div style="height: 48px; flex: none; border-bottom: 1px solid #cfcfcf; display: flex; align-items: center; justify-content: space-between; padding: 0 14px">
    <button type="button" style="background: none; border: none; padding: 0; font-size: 13px; font-weight: 500; color: #1a1a1a; display: flex; align-items: center; gap: 4px">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18 9 12l6-6"/></svg>
      Trips
    </button>
    <span style="width: 24px; height: 24px; border-radius: 99px; background: #ececec; border: 1px solid #cfcfcf; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 600; color: #6b6b6b">A</span>
  </div>

  <div style="height: 86px; flex: none; background: #ececec; display: flex; align-items: flex-end; padding: 8px 12px">
    <span style="font-size: 8px; font-weight: 700; letter-spacing: 1px; color: #8a8a8a">COVER</span>
  </div>

  <div style="flex: none; padding: 9px 16px 10px; border-bottom: 1px solid #cfcfcf; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px">
    <div>
      <h1 style="margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.3px">Madrid Gathering</h1>
      <div style="font-size: 12px; color: #6b6b6b; margin-top: 2px">Day 2 of 2 · Madrid</div>
    </div>
    <div style="display: flex; flex: none; margin-top: 3px">
      <span style="width: 22px; height: 22px; border-radius: 99px; background: #ececec; border: 1.5px solid #fff; display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: 600; color: #6b6b6b">A</span>
      <span style="width: 22px; height: 22px; border-radius: 99px; background: #e0e0e0; border: 1.5px solid #fff; margin-left: -7px; display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: 600; color: #6b6b6b">L</span>
      <span style="width: 22px; height: 22px; border-radius: 99px; background: #d4d4d4; border: 1.5px solid #fff; margin-left: -7px; display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: 600; color: #6b6b6b">M</span>
    </div>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 12px 16px">

    <!-- NOW -->
    <div style="border: 1.5px solid #1a1a1a; border-radius: 10px; padding: 12px 13px">
      <div style="font-size: 9px; font-weight: 700; letter-spacing: 1px">NOW</div>
      <div style="font-size: 16px; font-weight: 700; margin-top: 5px; letter-spacing: -0.2px">Mercado de San Miguel</div>
      <div style="font-size: 11px; color: #6b6b6b; margin-top: 3px">Until 14:30 · Plaza de San Miguel</div>
    </div>

    <!-- NEXT -->
    <div style="margin-top: 10px; border: 1px solid #cfcfcf; border-radius: 10px; padding: 11px 13px; display: flex; align-items: center; gap: 10px">
      <span style="font-size: 9px; font-weight: 700; letter-spacing: 1px; color: #6b6b6b; flex: none">NEXT</span>
      <span style="font-size: 12px"><strong style="font-weight: 600">15:30 Palacio Real</strong> · 12 min walk</span>
    </div>

    <!-- where everyone is -->
    <div style="margin-top: 10px; border: 1px solid #cfcfcf; border-radius: 10px; overflow: hidden">
      <div style="height: 70px; background: #ececec; position: relative">
        <span style="position: absolute; left: 70px; top: 26px; width: 11px; height: 11px; border-radius: 99px; background: #1a1a1a; border: 2px solid #fff"></span>
        <span style="position: absolute; left: 160px; top: 40px; width: 11px; height: 11px; border-radius: 99px; background: #6b6b6b; border: 2px solid #fff"></span>

      </div>
      <button type="button" style="width: 100%; background: #fff; border: none; border-top: 1px solid #e4e4e4; padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; text-align: left">
        <span style="font-size: 12px; font-weight: 600">Where everyone is</span>
        <span style="font-size: 11px; color: #6b6b6b">Open map</span>
      </button>
    </div>

    <!-- fast capture -->
    <button type="button" style="margin-top: 10px; width: 100%; background: #1a1a1a; color: #fff; border: none; border-radius: 9px; padding: 11px; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      Add an expense
    </button>

    <!-- rest of today -->
    <div style="margin-top: 12px">
      <div style="font-size: 9px; font-weight: 700; letter-spacing: 1px; color: #6b6b6b; margin-bottom: 7px">REST OF TODAY</div>
      <div style="display: flex; gap: 10px; font-size: 12px; padding: 5px 0"><span style="font-weight: 700; width: 42px; flex: none">17:00</span><span>Retiro Park</span></div>
      <div style="display: flex; gap: 10px; font-size: 12px; padding: 5px 0"><span style="font-weight: 700; width: 42px; flex: none">20:30</span><span>Dinner · Casa Botín</span></div>
    </div>

    <!-- reserved: alerts -->
    <div style="margin-top: 8px; border: 1.5px dashed #b0b0b0; border-radius: 10px; padding: 9px 12px">
      <span style="font-size: 11px; color: #6b6b6b"><strong style="font-weight: 600">Transport alerts</strong> — reserved slot, fills with R3</span>
    </div>

  </div>

  <div style="height: 66px; flex: none; border-top: 1px solid #cfcfcf; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <button type="button" style="background: none; border: none; border-top: 2px solid #1a1a1a; margin-top: -1px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #1a1a1a">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5"/></svg>
      <span style="font-size: 10px; font-weight: 600">Overview</span>
    </button>
    <button type="button" style="background: none; border: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #6b6b6b">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span style="font-size: 10px; font-weight: 500">Plan</span>
    </button>
    <button type="button" style="background: none; border: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #6b6b6b">
      <span style="position: relative; display: flex">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 7h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 7V6a2 2 0 0 1 2-2h11"/><circle cx="17" cy="13" r="1.3"/></svg>
        <span style="position: absolute; top: -5px; right: -7px; min-width: 15px; height: 15px; border-radius: 99px; background: #1a1a1a; color: #fff; font-size: 9px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 3px">1</span>
      </span>
      <span style="font-size: 10px; font-weight: 500">Money</span>
    </button>
    <button type="button" style="background: none; border: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #6b6b6b">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 5.5a3.2 3.2 0 0 1 0 5"/><path d="M18 14.2c1.8.9 3 2.7 3 4.8"/></svg>
      <span style="font-size: 10px; font-weight: 500">Group</span>
    </button>
  </div>

</div>
</x-dc>
