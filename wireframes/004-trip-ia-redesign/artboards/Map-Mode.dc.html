<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Map mode</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: Inter, system-ui, sans-serif; color: #1a1a1a; }
    a { color: #1d4ed8; } a:hover { color: #1e40af; }
    button { font: inherit; cursor: pointer; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; display: flex; flex-direction: column; overflow: hidden; position: relative">

  <!-- mode bar: a mode is closed, not navigated away from -->
  <div style="height: 56px; flex: none; border-bottom: 1px solid #cfcfcf; display: flex; align-items: center; gap: 12px; padding: 0 14px; background: #fff; position: relative; z-index: 2">
    <button type="button" aria-label="Close map" style="background: none; border: none; padding: 0; color: #1a1a1a; display: flex">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <span style="flex: 1">
      <span style="display: block; font-size: 14px; font-weight: 600">Where everyone is</span>
      <span style="display: block; font-size: 11px; color: #6b6b6b">Updated 30 seconds ago</span>
    </span>
    <span style="font-size: 10px; font-weight: 600; color: #6b6b6b; border: 1px solid #cfcfcf; border-radius: 99px; padding: 3px 8px">ESC</span>
  </div>

  <!-- map -->
  <div style="flex: 1; background: #ececec; position: relative; overflow: hidden">

    <div style="position: absolute; left: 0; right: 0; top: 120px; height: 10px; background: #e0e0e0"></div>
    <div style="position: absolute; left: 0; right: 0; top: 330px; height: 14px; background: #e0e0e0"></div>
    <div style="position: absolute; top: 0; bottom: 0; left: 96px; width: 10px; background: #e0e0e0"></div>
    <div style="position: absolute; top: 0; bottom: 0; left: 268px; width: 12px; background: #e0e0e0"></div>
    <div style="position: absolute; left: 130px; top: 160px; width: 110px; height: 130px; background: #e4e4e4; border-radius: 4px"></div>

    <!-- destination -->
    <div style="position: absolute; left: 236px; top: 274px; display: flex; flex-direction: column; align-items: center">
      <span style="font-size: 10px; font-weight: 600; background: #fff; border: 1px solid #cfcfcf; border-radius: 6px; padding: 2px 6px; white-space: nowrap">Palacio Real</span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff" stroke="#1a1a1a" stroke-width="1.8" aria-hidden="true" style="margin-top: 2px"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="2.6"/></svg>
    </div>

    <!-- people -->
    <div style="position: absolute; left: 70px; top: 196px; display: flex; flex-direction: column; align-items: center">
      <span style="width: 32px; height: 32px; border-radius: 99px; background: #1a1a1a; color: #fff; border: 3px solid #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700">Y</span>
    </div>
    <div style="position: absolute; left: 190px; top: 150px; display: flex; flex-direction: column; align-items: center">
      <span style="width: 32px; height: 32px; border-radius: 99px; background: #fff; color: #1a1a1a; border: 3px solid #1a1a1a; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700">A</span>
    </div>
    <div style="position: absolute; left: 288px; top: 226px; display: flex; flex-direction: column; align-items: center">
      <span style="width: 32px; height: 32px; border-radius: 99px; background: #fff; color: #1a1a1a; border: 3px solid #6b6b6b; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700">L</span>
    </div>
  </div>

  <!-- bottom sheet -->
  <div style="flex: none; border-top: 1px solid #cfcfcf; background: #fff; padding: 12px 16px 16px">
    <div style="width: 36px; height: 4px; border-radius: 99px; background: #cfcfcf; margin: 0 auto 12px"></div>

    <div style="display: flex; align-items: center; justify-content: space-between; padding: 7px 0">
      <span style="display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 600"><span style="width: 24px; height: 24px; border-radius: 99px; background: #1a1a1a; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 600">Y</span>You</span>
      <span style="font-size: 12px; color: #6b6b6b">Gran Vía</span>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 7px 0">
      <span style="display: flex; align-items: center; gap: 9px; font-size: 13px"><span style="width: 24px; height: 24px; border-radius: 99px; background: #ececec; color: #6b6b6b; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 600">A</span>Ana López</span>
      <span style="font-size: 12px; color: #6b6b6b">400 m away</span>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 7px 0">
      <span style="display: flex; align-items: center; gap: 9px; font-size: 13px"><span style="width: 24px; height: 24px; border-radius: 99px; background: #e0e0e0; color: #6b6b6b; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 600">L</span>Luis Martín</span>
      <span style="font-size: 12px; color: #6b6b6b">At Palacio Real</span>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 7px 0; opacity: 0.65">
      <span style="display: flex; align-items: center; gap: 9px; font-size: 13px"><span style="width: 24px; height: 24px; border-radius: 99px; background: #fff; border: 1.5px dashed #b0b0b0; color: #8a8a8a; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 600">M</span>Marta Ruiz</span>
      <span style="font-size: 12px; color: #6b6b6b">Not sharing</span>
    </div>

    <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid #e4e4e4; display: flex; align-items: center; justify-content: space-between; gap: 10px">
      <span style="font-size: 11px; color: #6b6b6b">You're sharing · stops in 4 min</span>
      <button type="button" style="flex: none; background: #fff; border: 1px solid #1a1a1a; border-radius: 7px; padding: 7px 12px; font-size: 12px; font-weight: 600">Stop sharing</button>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
