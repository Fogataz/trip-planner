# Keeps the Trip-Planner board in step with pull requests (pipeline.md §5, pipe-D1).
# PR opened or ready for review -> linked issues move to "In review".
# PR merged -> linked issues move to "Shipped".
# "Linked" means the PR closes them ("Closes #12" in the body, or linked in the sidebar).
# Needs the PROJECT_TOKEN secret: a fine-grained token with Projects read/write on the
# Fogataz organization and Issues/Pull requests read on this repo. GITHUB_TOKEN cannot
# write to an organization project.
name: Board status

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review, closed]

permissions:
  contents: read

jobs:
  status:
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      PROJECT_ID: PVT_kwDOFSao484Bq_Uu
      STATUS_FIELD_ID: PVTSSF_lADOFSao484Bq_UuzhpT-tA
      IN_REVIEW: 3a80ba44
      SHIPPED: f50fa9d1
      PR: ${{ github.event.pull_request.number }}
      DRAFT: ${{ github.event.pull_request.draft }}
      MERGED: ${{ github.event.pull_request.merged }}
    steps:
      - name: Move linked issues
        run: |
          if [ "$MERGED" = "true" ]; then option="$SHIPPED"; label="Shipped"
          elif [ "$DRAFT" = "true" ]; then echo "Draft PR, nothing to do"; exit 0
          else option="$IN_REVIEW"; label="In review"; fi

          items=$(gh api graphql -F pr="$PR" -f query='
            query($pr: Int!) {
              repository(owner: "Fogataz", name: "trip-planner") {
                pullRequest(number: $pr) {
                  closingIssuesReferences(first: 25) {
                    nodes { number projectItems(first: 10) { nodes { id project { id } } } }
                  }
                }
              }
            }' --jq ".data.repository.pullRequest.closingIssuesReferences.nodes[]
                    | .number as \$n | .projectItems.nodes[]
                    | select(.project.id == \"$PROJECT_ID\") | \"\(\$n) \(.id)\"")

          if [ -z "$items" ]; then echo "No linked issues on the board"; exit 0; fi

          echo "$items" | while read -r number item; do
            gh api graphql -f project="$PROJECT_ID" -f item="$item" \
              -f field="$STATUS_FIELD_ID" -f option="$option" -f query='
              mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $project, itemId: $item, fieldId: $field,
                  value: { singleSelectOptionId: $option }
                }) { projectV2Item { id } }
              }' > /dev/null
            echo "#$number -> $label"
          done
