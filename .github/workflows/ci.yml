# Quality gate for every pull request to main (ways-of-working.md §2, ww-D1).
# The job name "ci" is the required status check on main. Nothing auto-merges.
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: the two checks below diff against the base branch.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A docs/… branch is documentation only (ways-of-working.md §7.1, ww-D11).
      # The same script runs as step 3 of scripts/docs-commit.sh.
      - name: Docs-only branch
        if: startsWith(github.head_ref, 'docs/')
        run: scripts/docs-only-check.sh "origin/${{ github.base_ref }}"

      # CLAUDE.md is loaded into every Claude session, so its summary of the
      # docs conventions binds every session that follows it. docs/README.md
      # owns those conventions and product edits it; CLAUDE.md is engineering's.
      # This fails when docs/README.md has moved and nobody re-checked the
      # summary (ww-D14). It runs always, not only when those files change:
      # the drift is between two commits, not inside one diff.
      - name: CLAUDE.md mirrors the docs conventions
        run: scripts/claude-md-mirror-check.sh

      # Role labels must not inflect for gender. Spanish and Portuguese role
      # nouns do, and we neither collect gender nor guess it from a name
      # (O8 · Ungendered role labels, spec 012 §6.2). Passes silently until the
      # keys exist (ww-D15).
      - name: Role labels do not inflect for gender
        run: scripts/locale-lint.sh

      # A spec at approved or beyond carries its required sections, the design
      # lenses included (ways-of-working.md §2, ww-D10).
      - name: Spec sections
        run: |
          specs="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- 'docs/specs/*.md')"
          if [ -z "$specs" ]; then
            echo "No specs touched by this pull request."
            exit 0
          fi
          echo "$specs"
          scripts/spec-lint.sh $specs

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Client install
        working-directory: client
        run: npm ci

      - name: Client types and build
        working-directory: client
        run: npm run build

      - name: Client tests
        working-directory: client
        run: npm test

      - name: Server syntax
        run: find server -name '*.js' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 node --check

      # G5 · One helper (spec 011 §6.2) is the leading measure for epic #20:
      # it fails if 'organizer', 'host', 'co-host' or 'guest' is compared
      # anywhere outside services/permissions.js. Runs with node's built-in
      # test runner, so the server gains a suite without a new dependency.
      - name: Server tests
        run: npm test

      # Report only: findings show in the log but never fail the build.
      - name: Dependency audit (server)
        continue-on-error: true
        run: npm audit --omit=dev

      - name: Dependency audit (client)
        continue-on-error: true
        working-directory: client
        run: npm audit --omit=dev
